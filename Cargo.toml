[workspace]
members = ["compressed-rtf", "pst"]
resolver = "3"

[workspace.package]
authors = ["Microsoft", "Zach Mathis (@yamatosecurity)"]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/Yamato-Security/ys-outlook-parser"
license = "RPL-1.5 AND MIT"
keywords = ["outlook", "pst", "ost", "forensics", "mapi"]
categories = ["parser-implementations"]

[workspace.dependencies]
compressed-rtf = { package = "ys-outlook-parser-rtf", path = "compressed-rtf" }

byteorder = "1"
flate2 = "1"
thiserror = "2"
tracing = "0.1"
