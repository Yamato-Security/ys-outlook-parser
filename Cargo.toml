[workspace]
members = ["compressed-rtf", "msg", "outlook", "pst"]
resolver = "3"

[workspace.package]
authors = ["Microsoft", "Zach Mathis (@yamatosecurity)"]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/Yamato-Security/ys-outlook-parser"
license = "RPL-1.5 AND MIT"
keywords = ["outlook", "pst", "ost", "forensics", "mapi"]
categories = ["parser-implementations"]

[workspace.dependencies]
compressed-rtf = { package = "ys-outlook-parser-rtf", version = "1.0.0", path = "compressed-rtf" }

byteorder = "1"
cfb = "0.16"
encoding_rs = "0.8"
flate2 = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
