# Yamato Security's reader for Outlook .msg and .oft files ([MS-OXMSG]), read-only, for
# forensics: not published.
[package]
name = "ys-outlook-parser-msg"
description = "Outlook .msg and .oft files (MS-OXMSG) for forensics"
publish = false

version.workspace = true
authors = ["Zach Mathis (@yamatosecurity)"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# Our own code, so the RPL only (the rtf crate it uses is under the RPL and MIT)
license = "RPL-1.5"
keywords = ["outlook", "msg", "oft", "forensics", "mapi"]
categories.workspace = true

[lib]
name = "outlook_msg"

[dependencies]
cfb.workspace = true
compressed-rtf.workspace = true
encoding_rs.workspace = true
thiserror.workspace = true

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
