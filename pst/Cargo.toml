# Yamato Security's fork of Microsoft's outlook-pst (https://github.com/microsoft/outlook-pst-rs),
# read-only, for forensics: not published.
[package]
name = "ys-outlook-parser-pst"
description = "PST and OST files (MS-PST, and the 4 KiB layout of Outlook 2013 and later OSTs) for forensics"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "outlook_pst"

[dependencies]
byteorder.workspace = true
flate2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The mutation test decompresses the RTF bodies it reads.
compressed-rtf.workspace = true
